name: Weekly Qdrant Upload

on:
  # Run every Sunday at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Allow manual triggering (optionally for a single collection)
  workflow_dispatch:
    inputs:
      collection:
        description: 'Collection name to process (awsna-accreditation, awsna-renewal, sgws). Blank = all.'
        required: false
        default: ''

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create credentials file
      run: |
        mkdir -p ./credentials
        echo '${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}' > ./credentials/service-account.json
        echo "Credentials file created successfully"
    
    - name: Set up environment variables
      run: |
        echo "GOOGLE_DRIVE_CREDENTIALS_PATH=./credentials/service-account.json" >> $GITHUB_ENV
        # Set up multi-collection configuration using GitHub's recommended approach
        echo "COLLECTIONS_CONFIG<<EOF" >> $GITHUB_ENV
        echo "$COLLECTIONS_CONFIG_SECRET" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        echo "Using multi-collection configuration"
      env:
        COLLECTIONS_CONFIG_SECRET: ${{ secrets.COLLECTIONS_CONFIG }}
    
    - name: Run uploader
      run: |
        echo "Starting AWSNA Qdrant AutoUploader..."
        echo "Python version: $(python --version)"
        echo "Current directory: $(pwd)"
        echo "Files in directory: $(ls -la)"
        echo "Environment variables:"
        echo "GOOGLE_DRIVE_CREDENTIALS_PATH: $GOOGLE_DRIVE_CREDENTIALS_PATH"
        echo "COLLECTIONS_CONFIG present: $(if [ -n "$COLLECTIONS_CONFIG" ]; then echo 'Yes'; else echo 'No'; fi)"
        
        # Check if secrets are properly set
        echo "Checking secrets configuration..."
        if [ -z "$COLLECTIONS_CONFIG" ]; then
          echo "WARNING: COLLECTIONS_CONFIG environment variable is empty"
          echo "This means the GitHub secret may not be set properly"
        else
          echo "COLLECTIONS_CONFIG is present and non-empty"
        fi
        
        echo "Running main.py..."
        set -e  # Exit on any error
        python main.py ${{ inputs.collection }} 2>&1 | tee uploader.log
        exit_code=${PIPESTATUS[0]}
        echo "Python exit code: $exit_code"
        
        if [ $exit_code -ne 0 ]; then
          echo "ERROR: Python script failed with exit code $exit_code"
          exit $exit_code
        fi
      env:
        # Overrides the per-collection openai_api_key inside COLLECTIONS_CONFIG when set, so a key
        # rotation is one `gh secret set OPENAI_API_KEY` (vault item op://Jax/OPENAI_API_KEY).
        OPENAI_API_KEY_OVERRIDE: ${{ secrets.OPENAI_API_KEY }}
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: uploader-logs
        path: |
          uploader.log
          *.log
        retention-days: 30
    
    - name: Cron Monitor heartbeat
      if: always()
      env:
        CRON_MONITOR_URL: ${{ secrets.CRON_MONITOR_URL }}
        CRON_MONITOR_TOKEN: ${{ secrets.CRON_MONITOR_TOKEN }}
        JOB_STATUS: ${{ job.status }}
        COLLECTION: ${{ inputs.collection }}
      run: |
        if [ -z "$CRON_MONITOR_URL" ] || [ -z "$CRON_MONITOR_TOKEN" ]; then
          echo "Cron Monitor secrets not set; skipping heartbeat"; exit 0
        fi
        summary=$(grep -oE '✓ [a-z-]+: [0-9]+ docs, [0-9]+ chunks' uploader.log 2>/dev/null | sort -u | tr '\n' ';' | sed 's/;$//')
        zero=$(grep -oE 'ZERO-VECTOR chunks: [0-9]+ of [0-9]+' uploader.log 2>/dev/null | sort -u | tr '\n' ';' | sed 's/;$//')
        if [ "$JOB_STATUS" = "success" ] && [ -n "$zero" ]; then
          state=degraded; msg="Weekly Qdrant upload finished but some chunks have no embedding ($zero) (${COLLECTION:-all collections}): ${summary:-see run log}"
        elif [ "$JOB_STATUS" = "success" ]; then
          state=healthy; msg="Weekly Qdrant upload succeeded (${COLLECTION:-all collections}): ${summary:-see run log}"
        else
          state=failed; msg="Weekly Qdrant upload $JOB_STATUS (${COLLECTION:-all collections}); see GitHub Actions run $GITHUB_RUN_ID"
        fi
        STATE="$state" MSG="$msg" python3 -c 'import json,os; print(json.dumps({"status":os.environ["STATE"],"message":os.environ["MSG"]}))' > hb.json
        curl -fsS --max-time 15 -X POST           -H "Authorization: Bearer $CRON_MONITOR_TOKEN" -H "Content-Type: application/json"           --data @hb.json "$CRON_MONITOR_URL/heartbeat/awsna-qdrant-upload"           || echo "WARNING: Cron Monitor heartbeat failed"
